# Builds Hubble.app for a pushed v* tag and attaches Hubble.zip to the GitHub release.
# The landing page links to releases/latest/download/Hubble.zip, so it always serves the newest build.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/Hubble.app Hubble.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Hubble.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" Hubble.zip --title "Hubble $GITHUB_REF_NAME" --generate-notes
          fi
